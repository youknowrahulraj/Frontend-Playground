<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoX - Sign Up</title>
  <link rel="stylesheet" href="signUp.css">
</head>
<body>
  <div class="container">
    <h1>🌍 Welcome to EcoX</h1>
    <h3>Sign Up Details</h3>

    <form action="explore.html" method="post"> 
      <div>
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
      </div>

      <div>
        <label for="parentName">Parent's Name</label>
        <input type="text" id="parentName" name="parentName" placeholder="Enter your parent's name" required>
      </div>

      <div>
        <label for="schoolId">School ID</label>
        <input type="text" id="schoolId" name="schoolId" placeholder="Enter your School ID" required>
      </div>

      <div>
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" name="studentId" placeholder="Enter your Student ID" required>
      </div>

      <div>
        <label for="class">Class</label>
        <input type="text" id="class" name="class" placeholder="Enter your Class" required>
      </div>

      <div>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" required>
      </div>

      <div>
        <label for="email">Gmail</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
      </div>

      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Choose a password" required>
      </div>

      <div class="gender-box">
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
      </div>

      <div>
       <div>
  <div class="checkbox-inline">
  <input type="checkbox" id="infoCorrect" name="infoCorrect" required>
  <label for="infoCorrect">I have entered my information correctly ✅</label>
</div>

</div>

      </div>

      <button type="submit">🌱 Sign Up</a></button>
    </form>

    <p class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>

  <script>
    alert("Welcome to EcoX 🌿 – Create your account now!");
  </script>
  <div class="layout-box">
    <a href="layout.html" class="layout-btn">
        Click Here to Change Layout
    </a>

    <div class="page-nav">
        <a href="index.html">1</a>
        <a href="2.html">2</a>
        <a href="login.html">3</a>
        <a href="4.html">4</a>
    </div>
</div>
</body>
</html>
