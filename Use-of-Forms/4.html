<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <link rel="stylesheet" href="4.css">
</head>

<body>
    <h1>Personal Information</h1>

    <div class="fill">
        <form>

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" autofocus required>
            </div>

            <div>
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label for="dob">D.O.B.</label>
                <input type="date" id="dob" required>
            </div>

            <div>
                <label for="phone">Phone No.</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <div>
                <label for="state">State</label>
                <input type="text" placeholder="Enter your state" required>
            </div>

            <div>
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter your city" required>
            </div>

            <div>
                <label for="pincode">Pincode</label>
                <input type="number" id="pincode" required placeholder="Enter your pincode">
            </div>

            <div class="checkbox-group">
                <input id="check" type="checkbox" required>
                <label for="check">I have entered my data correctly</label>
            </div>

            <div>
                <textarea id="textarea" placeholder="Enter your comment"></textarea>
            </div>

            <button type="submit">Submit</button>

        </form>
    </div>
    <div class="layout-box">
    <a href="layout.html" class="layout-btn">
        Click Here to Change Layout
    </a>

       <a href="index.html">1</a>
        <a href="2.html">2</a>
        <a href="login.html">3</a>
        <a href="4.html">4</a>
    </div>
</div>
</body>
</html>
