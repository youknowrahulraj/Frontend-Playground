<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="uObg5PGo12tSCiwJR87tyIa9AxQV4UbPxTiJi5tUjHc" />
    <title>Frontend Playground | Rahul Raj</title>

    <meta name="description"
    content="A collection of frontend development projects built using HTML, CSS, and JavaScript by Rahul Raj.">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#0f172a;
            font-family:Arial,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:90%;
            max-width:900px;
            text-align:center;
        }

        h1{
            color:white;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .projects{
            display:grid;
            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:20px;
        }

        .card{
            text-decoration:none;
            color:white;

            padding:30px;

            background:#1e293b;

            border-radius:15px;

            transition:.3s;
        }

        .card:hover{
            transform:translateY(-10px);
            background:#334155;
        }

        footer{
            margin-top:40px;
            color:#94a3b8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Frontend Playground</h1>

    <p>
        A collection of frontend development projects built using HTML, CSS, and JavaScript.
    </p>

    <div class="projects">

        <a href="CSS Transform Property/" class="card">
            CSS Transform Playground
        </a>

        <a href="calculator/" class="card">
            Web Calculator
        </a>

        <a href="Facebook Login page/" class="card">
            Facebook Login Clone
        </a>

        <a href="Use-of-Forms/" class="card">
            Use of Forms
        </a>

        <a href="tic tac toi/" class="card">
            Tic Tac Toe
        </a>

        <a href="counting app/" class="card">
            Counting App
        </a>

    </div>

    <footer>
        <p>Made with ❤️ by Rahul Raj</p>
    </footer>

</div>

</body>
</html>
