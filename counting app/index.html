<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="Simple Counter App  A lightweight web application built using HTML, CSS, and JavaScript that allows users to increment, decrement, and reset the counter value.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container">
            <h2>Simple count machine</h2>
            <p id="value">
                0
            </p>
            <div>
                <button onclick="decrement()">-</button>
            </div>
            <div>
                <button onclick="increment()">+</button>
            </div>
            <div>
                <button onclick="reset()">Reset</button>
            </div>
        </div>
    </main>
    <footer>
        <footer>
            <p>&copy; 2026 Rahul Raj. Made with ❤️ by Rahul Raj.</p>
        </footer>
    </footer>

    <script src="script.js"></script>
</body>

</html>
